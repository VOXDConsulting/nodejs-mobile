name: Build CuidaMSG Node Android runtime

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch to build
        required: true
        default: codex/node24.18-android

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_TARGET_SDK_VERSION: 26

jobs:
  build-android:
    name: Build ${{ matrix.target_arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target_arch:
          - arm64
          - x86_64

    steps:
      - name: Check out patched Node source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Build Android runtime
        env:
          LDFLAGS: -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384
        run: |
          ./tools/android_build.sh \
            "$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            "$ANDROID_TARGET_SDK_VERSION" \
            "${{ matrix.target_arch }}"

      - name: Verify architecture output
        run: |
          case "${{ matrix.target_arch }}" in
            arm64) abi="arm64-v8a" ;;
            x86_64) abi="x86_64" ;;
            *) exit 1 ;;
          esac
          lib="out_android/${abi}/libnode.so"
          test -f "$lib"
          readelf -lW "$lib" | awk '
            BEGIN { seen = 0 }
            $1 == "LOAD" {
              seen = 1
              if ($NF != "0x4000") exit 1
            }
            END { if (!seen) exit 1 }
          '
          nm -D -C "$lib" | grep -Fq 'node::Start'
          nm -D -C "$lib" | grep -Fq 'WebAssembly'

      - name: Upload architecture output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-android-${{ matrix.target_arch }}
          path: out_android
          retention-days: 1

  combine-android:
    name: Combine Android runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: build-android

    steps:
      - name: Check out patched Node source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}

      - name: Download architecture outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: node-android-*
          merge-multiple: true
          path: out_android

      - name: Assemble distributable runtime
        run: |
          mkdir -p artifacts/bin artifacts/include
          test -f out_android/arm64-v8a/libnode.so
          test -f out_android/x86_64/libnode.so
          test -f out_android/libnode/include/node/node.h
          cp -R out_android/arm64-v8a artifacts/bin/
          cp -R out_android/x86_64 artifacts/bin/
          cp -R out_android/libnode/include/* artifacts/include/
          (
            cd artifacts
            sha256sum \
              bin/arm64-v8a/libnode.so \
              bin/x86_64/libnode.so \
              > SHA256SUMS
          )

      - name: Upload combined runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nodejs-mobile-android-node24.18
          path: artifacts
          retention-days: 1
